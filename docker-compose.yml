services:
  api:
    build: .
    image: desafio-viacep-api
    environment:
      APP_NAME: ${APP_NAME:-API de Endereços}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-enderecos}
      VIACEP_BASE_URL: ${VIACEP_BASE_URL:-https://viacep.com.br/ws}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-3}
      VIACEP_TENTATIVAS: ${VIACEP_TENTATIVAS:-3}
      VIACEP_BACKOFF_INICIAL: ${VIACEP_BACKOFF_INICIAL:-0.2}
      RATE_LIMIT_REQUISICOES: ${RATE_LIMIT_REQUISICOES:-60}
      RATE_LIMIT_JANELA: ${RATE_LIMIT_JANELA:-60}
      API_KEY: ${API_KEY:?defina API_KEY no arquivo .env}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-enderecos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
